[project]
name = "worklog"
version = "0.1.0"
description = "Self-hosted work/break timer with reports and an optional day planner"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "sentry-sdk[fastapi]>=2.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worklog", "balance", "day"]

[tool.pytest.ini_options]
testpaths = ["tests"]
